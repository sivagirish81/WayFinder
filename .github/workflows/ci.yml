name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [apps/api, apps/worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: wayfinder/${{ matrix.app }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        working-directory: wayfinder/${{ matrix.app }}
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wayfinder/apps/web/package-lock.json
      - name: Install
        working-directory: wayfinder/apps/web
        run: npm install
      - name: Test
        working-directory: wayfinder/apps/web
        run: npm test -- --run
