[project]
name = "wayfinder-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "langchain-core>=0.2",
  "langgraph>=0.2",
  "openai>=1.40",
  "opentelemetry-api>=1.25",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "temporalio>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["wayfinder_worker/tests"]

[tool.setuptools.packages.find]
include = ["wayfinder_worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"
